name: Pull request checks

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:

  python-quality-check: # Install dependencies and run tests with pytest
     name: Python tests
     runs-on: ubuntu-latest

     strategy:
       matrix:
         python-version: ["3.10","3.11","3.12"]

     steps:
       - uses: actions/checkout@v3
       - name: Set up Python ${{ matrix.python-version }}
         uses: actions/setup-python@v4
         with:
           python-version: ${{ matrix.python-version }}
       - name: Install dependencies
         run: |
           python -m pip install --upgrade pip
           curl -LsSf https://astral.sh/uv/install.sh | sh
           uv pip install -r scripts/quality_requirements.txt --system
           uv pip install . --system
       - name: Launch quality check and tests
         run: |
            cd scripts 
            chmod +x run_quality_check.sh
            ./run_quality_check.sh
            cd ..

    
